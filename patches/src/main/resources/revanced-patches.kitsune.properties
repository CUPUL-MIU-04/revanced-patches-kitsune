# revanced-patches.kitsune.properties
# Core patch metadata
patches.name=Kitsune
patches.version=4.5.4
patches.description=Custom patches for Kitsune apps modified through ReVanced
patches.author=CUPUL-MIU-04
patches.license=GPL-3.0

# Target app configuration
target.package=com.kitsune.app
target.version=17.0+
min.api=21
max.api=33

# Patch compatibility
dependencies=[
    "revanced-patcher:12.0.0",
    "revanced-integrations:19.0.0"
]

# Feature flags
experimental=false
requires.resources=true
requires.integrations=true

# Patch-specific configurations
## Remove ads
patch.removeAds.enabled=true
patch.removeAds.classes=[
    "com.kitsune.ads.AdService",
    "com.kitsune.ads.BannerAd"
]

## Premium unlock
patch.premium.enabled=true
patch.premium.key=premium_state
patch.premium.type=boolean

## Custom theme
patch.customTheme.enabled=false
patch.customTheme.colorPrimary=#FF4285F4
patch.customTheme.colorAccent=#FF34A853

# Debug settings
verbose=false
debuggable=false