name: Publish to GitHub Packages

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para algunos plugins de publicación

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # Versión más reciente
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # Habilita caching para Gradle

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          CI: true