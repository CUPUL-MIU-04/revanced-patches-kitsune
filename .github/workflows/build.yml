name: Build

on: 
  push:
    branches: 
      - master
      - dev
  pull_request:
    branches: 
      - master
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Para obtener todo el historial de commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4  # Versión más reciente
        with:
          distribution: 'temurin'    # Distribución recomendada
          java-version: '17'
          cache: 'gradle'            # Habilita caching para Gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew       # Asegura que el wrapper sea ejecutable

      - name: Build with Gradle
        run: ./gradlew build
        env:
          CI: true                  # Variable común para entornos CI

      - name: Publish artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'  # Solo en ramas específicas
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true