name: Open PR from dev to master  # Cambiado de "main" a "master"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  MESSAGE: Merge branch 'dev' to 'master'  # Cambiado "main" → "master"

jobs:
  pull-request:
    name: Open pull request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open pull request
        uses: repo-sync/pull-request@v2
        with:
          source_branch: dev       # Rama de origen (donde están los cambios)
          destination_branch: master  # Rama destino (cambiada de "main" a "master")
          pr_title: 'chore: ${{ env.MESSAGE }}'
          pr_body: |
            This PR merges changes from dev to master.
            Auto-generated by GitHub Actions.
          pr_draft: true
          github_token: ${{ secrets.GITHUB_TOKEN }}