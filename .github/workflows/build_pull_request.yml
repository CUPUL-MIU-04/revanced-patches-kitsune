name: PR Build Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}  # Checkout del commit específico del PR

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'  # Habilita caching automático

      - name: Gradle Cache
        uses: burrunan/gradle-cache-action@v1
        with:
          gradle-version: wrapper  # Usa la versión del wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTRO_TOKEN: ${{ secrets.OTRO_TOKEN }}
          CI: true  # Variable estándar para entornos CI

      - name: Upload build reports (optional)
        if: always()  # Se ejecuta incluso si falla el build
        uses: actions/upload-artifact@v3
        with:
          name: build-reports
          path: |
            **/build/reports
            **/build/test-results